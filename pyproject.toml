[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mini"
description = "Agent-mini: a minimal ReAct agent built from scratch"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.128,<0.129",
    "httpx>=0.27",
    "pydantic>=2.6",
    "uvicorn>=0.40,<0.41",
    "pymongo>=4.9,<5",
    "redis>=7.4,<8",
    "sqlalchemy>=2.0.36,<2.1",
    "asyncmy>=0.2.9,<0.3",
    "tiktoken>=0.12,<0.13",
    "tzdata>=2025.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.3,<1.4",
    "pytest-cov>=7.1,<7.2",
    "fakeredis>=2.23,<3",
    "mongomock>=4.3,<5",
    "aiosqlite>=0.20,<0.23",
    "respx>=0.23,<0.24",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<2.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_mini*"]

[tool.setuptools.dynamic]
version = { attr = "agent_mini.version.__version__" }

[tool.setuptools.package-data]
"agent_mini.systemdb" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "unit: 单元测试",
    "contract: 契约测试",
    "integration: 集成测试",
    "e2e: 端到端测试",
    "slow: 非功能或耗时测试",
    "live: 真实 API 验收",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["agent_mini", "tests"]
extend-exclude = ["Docs", "openspec"]

[tool.ruff.lint]
preview = true
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "C4",
    "RET", "ANN", "D", "TID", "RUF", "C90",
    "too-many-return-statements", "too-many-branches", "too-many-arguments",
    "too-many-statements", "too-many-nested-blocks",
]
ignore = [
    "undocumented-public-init", "incorrect-blank-line-before-class",
    "multi-line-summary-second-line", "missing-trailing-period",
    "non-imperative-mood", "first-word-uncapitalized",
    "missing-terminal-punctuation", "undocumented-param",
    "ambiguous-unicode-character-string", "ambiguous-unicode-character-docstring",
    "ambiguous-unicode-character-comment",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]
"agent_mini/context/window.py" = ["error-suffix-on-exception-name"]
"agent_mini/interface/http.py" = ["complex-structure"]
"agent_mini/observability/logging.py" = ["too-many-return-statements"]
"agent_mini/runtime/loop.py" = [
    "complex-structure",
    "too-many-return-statements",
]
"**/__init__.py" = ["unused-import"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50
max-nested-blocks = 3

[tool.ruff.lint.isort]
known-first-party = ["agent_mini"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

