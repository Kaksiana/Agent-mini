[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mini"
description = "Agent-mini: a minimal ReAct agent built from scratch"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_mini*"]

[tool.setuptools.dynamic]
version = { attr = "agent_mini.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["agent_mini", "tests"]

[tool.ruff.lint]
preview = true
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "C4",
    "RET", "ANN", "D", "TID", "RUF", "C90",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR1702",
]
ignore = [
    "D107", "D203", "D213", "D400", "D401", "D403", "D415", "D417",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50
max-nested-blocks = 3

[tool.ruff.lint.isort]
known-first-party = ["agent_mini"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
